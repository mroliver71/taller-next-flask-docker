apiVersion: apps/v1
kind: Deployment

metadata:
  name: mi-app-web

spec:
  replicas: 2

  selector:
    matchLabels:
      app: mi-app-web

  template:
    metadata:
      labels:
        app: mi-app-web

    spec:
      containers:
      - name: mi-app-web
        image: mi-app-web:v1
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 80